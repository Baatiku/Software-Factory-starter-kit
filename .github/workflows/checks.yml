name: Factory structural regression checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  factory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run factory unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check shipped kit structure
        run: python3 scripts/check.py --repo . --gate kit
      - name: Compile Python scripts
        run: python3 -m compileall -q scripts tests
