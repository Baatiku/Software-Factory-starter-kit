name: Universal Work Factory checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run factory regression suite
        run: python3 -m unittest discover -s tests -v
      - name: Validate sole current toolkit structure
        run: python3 scripts/check_kit.py
      - name: Compile Python tooling
        run: python3 -m compileall -q scripts tests factory/tools
