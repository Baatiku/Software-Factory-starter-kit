name: Package Universal Work Factory skill
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  skill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run packaging and factory regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Build self-contained universal ZIP
        run: python3 scripts/package_work_factory.py --profile all --output dist/work-factory.zip
      - name: Validate ZIP archive
        run: python3 -m zipfile -t dist/work-factory.zip
      - name: Upload current skill
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: universal-work-factory-installable-skill
          path: dist/work-factory.zip
          if-no-files-found: error
          retention-days: 30
