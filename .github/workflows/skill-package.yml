name: Package portable Software Factory skill
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  skill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run factory and packaging tests
        run: python3 -m unittest discover -s tests -v
      - name: Build ZIP
        run: python3 scripts/package_skill.py --output dist/software-factory-skill.zip
      - name: Check ZIP archive
        run: python3 -m zipfile -t dist/software-factory-skill.zip
      - name: Upload ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: software-factory-installable-skill
          path: dist/software-factory-skill.zip
          if-no-files-found: error
          retention-days: 30
